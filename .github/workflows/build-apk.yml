name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'medical_stock_offline_android.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q medical_stock_offline_android.zip -d source
          
      - name: Fix Kotlin duplicate classes
        run: |
          cat > kotlin-fix.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
            }
          }
          EOF
          
      - name: Build APK
        run: |
          gradle -I "$GITHUB_WORKSPACE/kotlin-fix.gradle" -p "$GITHUB_WORKSPACE/source/medical_stock_offline_android" assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medical-stock-debug-apk
          path: source/medical_stock_offline_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
